[project]
name = "chrono-rag-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "wikitextparser>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
src = ["app"]

[tool.ruff.lint]
ignore = ["E501"]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
]
